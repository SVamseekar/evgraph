name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            reference/python/evgraph-core/pyproject.toml
            reference/python/evgraph-rules/pyproject.toml
            reference/python/evgraph/pyproject.toml
            reference/python/evgraph-cli/pyproject.toml

      - name: Install packages (editable)
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -e reference/python/evgraph-core
          pip install -e reference/python/evgraph-rules
          pip install -e reference/python/evgraph
          pip install -e reference/python/evgraph-cli

      - name: Check lockstep versions
        run: python scripts/check_release_version.py

      - name: Run tests
        run: |
          pytest reference/python/evgraph-core -q
          pytest reference/python/evgraph-rules -q
          pytest reference/python/evgraph -q
          pytest reference/python/evgraph-cli -q

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            reference/python/evgraph-core/pyproject.toml
            reference/python/evgraph-rules/pyproject.toml
            reference/python/evgraph/pyproject.toml
            reference/python/evgraph-cli/pyproject.toml

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Build wheels and sdists
        run: python scripts/build_dists.py

      - name: Check metadata
        run: python -m twine check --strict dist/*/*
