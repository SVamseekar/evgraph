[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evident-rules"
version = "0.1.0"
description = "Evident reference rule pack: approval-precedes-deployment, dataset-manifest-complete, and model-version-has-training-provenance."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
authors = [
    { name = "Soura", email = "martisoura@gmail.com" },
]
keywords = [
    "evidence-graph",
    "governance",
    "rules",
    "audit",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["evident-core>=0.1.0"]

[project.urls]
Homepage = "https://github.com/SVamseekar/evident"
Documentation = "https://github.com/SVamseekar/evident/tree/main/docs"
Repository = "https://github.com/SVamseekar/evident"
Changelog = "https://github.com/SVamseekar/evident/blob/main/CHANGELOG.md"
Issues = "https://github.com/SVamseekar/evident/issues"

[project.optional-dependencies]
test = ["pytest>=7"]

[project.entry-points."evident.rules"]
approval_precedes_deployment = "evident_rules.approval_precedes_deployment:ApprovalPrecedesDeploymentRule"
dataset_manifest_complete = "evident_rules.dataset_manifest_complete:DatasetManifestCompleteRule"
model_version_has_training_provenance = "evident_rules.model_version_has_training_provenance:ModelVersionHasTrainingProvenanceRule"

[tool.setuptools.packages.find]
where = ["src"]
