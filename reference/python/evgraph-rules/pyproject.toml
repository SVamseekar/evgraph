[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evgraph-rules"
version = "0.1.2"
description = "Built-in Evgraph rule pack: approval, dataset-manifest, and model-version provenance checks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
authors = [
    { name = "Marti Soura Vamseekar", email = "martisoura@gmail.com" },
]
keywords = [
    "evidence-graph",
    "governance",
    "rules",
    "audit",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["evgraph-core>=0.1.0"]

[project.urls]
Homepage = "https://github.com/SVamseekar/evgraph"
Documentation = "https://github.com/SVamseekar/evgraph/tree/main/docs"
Repository = "https://github.com/SVamseekar/evgraph"
Changelog = "https://github.com/SVamseekar/evgraph/blob/main/CHANGELOG.md"
Issues = "https://github.com/SVamseekar/evgraph/issues"

[project.optional-dependencies]
test = ["pytest>=7"]

[project.entry-points."evgraph.rules"]
approval_precedes_deployment = "evgraph_rules.approval_precedes_deployment:ApprovalPrecedesDeploymentRule"
dataset_manifest_complete = "evgraph_rules.dataset_manifest_complete:DatasetManifestCompleteRule"
model_version_has_training_provenance = "evgraph_rules.model_version_has_training_provenance:ModelVersionHasTrainingProvenanceRule"

[tool.setuptools.packages.find]
where = ["src"]
