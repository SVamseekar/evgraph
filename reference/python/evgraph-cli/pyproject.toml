[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evgraph-cli"
version = "0.1.2"
description = "evgraph command. EU AI Assurance OS pins evgraph-cli==0.1.2. A missing approval timestamp stays inconclusive."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
authors = [
    { name = "Marti Soura Vamseekar", email = "martisoura@gmail.com" },
]
keywords = [
    "evidence-graph",
    "governance",
    "cli",
    "audit",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["evgraph>=0.1.0"]

[project.urls]
Homepage = "https://github.com/SVamseekar/evgraph"
Documentation = "https://github.com/SVamseekar/evgraph/tree/main/docs"
Repository = "https://github.com/SVamseekar/evgraph"
Changelog = "https://github.com/SVamseekar/evgraph/blob/main/CHANGELOG.md"
Issues = "https://github.com/SVamseekar/evgraph/issues"

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
evgraph = "evgraph_cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
