[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evident"
version = "0.1.0"
description = "Evident Python library: adapters, reporters, rule discovery, and scan() API for governance evidence."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
authors = [
    { name = "Marti Soura Vamseekar", email = "martisoura@gmail.com" },
]
keywords = [
    "evidence-graph",
    "governance",
    "model-cards",
    "mlflow",
    "sarif",
    "oscal",
    "audit",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "evident-core>=0.1.0",
    "evident-rules>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/SVamseekar/evident"
Documentation = "https://github.com/SVamseekar/evident/tree/main/docs"
Repository = "https://github.com/SVamseekar/evident"
Changelog = "https://github.com/SVamseekar/evident/blob/main/CHANGELOG.md"
Issues = "https://github.com/SVamseekar/evident/issues"

[project.optional-dependencies]
test = ["pytest>=7"]
mlflow = ["mlflow>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]
