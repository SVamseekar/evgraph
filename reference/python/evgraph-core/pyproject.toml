[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evgraph-core"
version = "0.1.0"
description = "Core types for Evgraph: Evidence Graph, nodes, edges, evidence levels, rules, and findings."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
authors = [
    { name = "Marti Soura Vamseekar", email = "martisoura@gmail.com" },
]
keywords = [
    "evidence-graph",
    "governance",
    "audit",
    "model-risk",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/SVamseekar/evgraph"
Documentation = "https://github.com/SVamseekar/evgraph/tree/main/docs"
Repository = "https://github.com/SVamseekar/evgraph"
Changelog = "https://github.com/SVamseekar/evgraph/blob/main/CHANGELOG.md"
Issues = "https://github.com/SVamseekar/evgraph/issues"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
